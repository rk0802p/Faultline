name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compile Python bytecode
        run: python -m compileall -q faultline tests examples

      - name: Validate client JavaScript syntax
        run: node --check faultline/web/app.js

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: Verify wheel packaging and package data
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m zipfile -l dist/*.whl | grep "scenarios/"
          python -m zipfile -l dist/*.whl | grep "web/"

      - name: Verify installed-wheel smoke test outside repository checkout
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/python -m pip install dist/*.whl
          mkdir /tmp/smoke-run
          cd /tmp/smoke-run
          /tmp/smoke-venv/bin/python -m faultline.cli --help
          /tmp/smoke-venv/bin/python -c "from faultline import store; store.initialize(); scens = store.list_scenarios(); assert len(scens) >= 3, f'Expected >= 3 seeded scenarios, got {len(scens)}'"

  integration-resilience-suite:
    name: Critical Integration Suite & Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Start Faultline platform daemon
        run: |
          python -m faultline.server --port 8000 &
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:8000/api/health > /dev/null; then
              echo "Faultline server is ready on port 8000"
              exit 0
            fi
            sleep 0.5
          done
          echo "Faultline server failed to start"
          exit 1

      - name: Run Critical Integrations Suite (Fixed Mode)
        run: |
          python -m faultline.cli run \
            --suite critical-integrations \
            --implementation fixed \
            --report-format junit \
            --output test-results/critical-integrations-junit.xml

      - name: Run Defect Detection Benchmark (100% Target)
        run: python -m faultline.cli benchmark --measure-determinism

      - name: Verify Operational Metrics & Prometheus Export
        run: python -m faultline.cli metrics

      - name: Test Artifact Retention Pruning (Dry Run)
        run: python -m faultline.cli prune --project faultline-demo --days 30 --dry-run

      - name: Run Programmatic SDK Checkout Demo
        run: python examples/checkout_demo.py

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: test-results/critical-integrations-junit.xml

  docker-compose-smoke:
    name: Multi-Container Docker Compose Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and start multi-container stack
        run: docker compose up -d --build

      - name: Wait for services to become healthy
        run: |
          for i in $(seq 1 60); do
            cp_health=$(docker inspect --format='{{json .State.Health.Status}}' faultline-control-plane 2>/dev/null || echo "starting")
            ck_health=$(docker inspect --format='{{json .State.Health.Status}}' faultline-checkout-service 2>/dev/null || echo "starting")
            py_health=$(docker inspect --format='{{json .State.Health.Status}}' faultline-payment-provider 2>/dev/null || echo "starting")
            echo "Waiting for services... attempt $i (control-plane: $cp_health, checkout: $ck_health, payment: $py_health)"
            if [ "$cp_health" = '"healthy"' ] && [ "$ck_health" = '"healthy"' ] && [ "$py_health" = '"healthy"' ]; then
              echo "All core services reported healthy."
              exit 0
            fi
            sleep 2
          done
          echo "Services failed to become healthy within deadline"
          docker compose ps
          docker compose logs
          exit 1

      - name: Query health and seeded scenarios over loopback ports
        run: |
          curl -f -s http://127.0.0.1:8000/api/health
          curl -f -s http://127.0.0.1:8000/api/scenarios | grep "payment-response-lost"
          curl -f -s http://127.0.0.1:8766/v1/health
          curl -f -s http://127.0.0.1:8767/v1/health

      - name: Teardown Docker Compose stack
        if: always()
        run: docker compose down -v
